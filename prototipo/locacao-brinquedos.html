<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestão de Locação de Brinquedos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F6;--surface:#FFFFFF;--ink:#16203A;--muted:#58637C;--line:#D6DCE7;
  --blue:#2350D8;--yellow:#FFC72C;--yellow-ink:#16203A;--green:#12804F;--red:#C8333D;--orange:#A85A06;
  --soft-blue:#E2E9FD;--soft-green:#DBF2E6;--soft-red:#FBE2E4;--soft-yellow:#FFF1C7;--soft-grey:#E6E9EF;
  --shade:rgba(10,16,35,.45);
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1322;--surface:#181F33;--ink:#E7EBF5;--muted:#9BA5BD;--line:#2A3350;
    --blue:#7196FF;--yellow:#FFCF45;--yellow-ink:#16203A;--green:#43C98B;--red:#FF727B;--orange:#F2A650;
    --soft-blue:#1F2B52;--soft-green:#15392A;--soft-red:#43202A;--soft-yellow:#3A3118;--soft-grey:#252D44;
    --shade:rgba(0,0,0,.6);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1322;--surface:#181F33;--ink:#E7EBF5;--muted:#9BA5BD;--line:#2A3350;
  --blue:#7196FF;--yellow:#FFCF45;--yellow-ink:#16203A;--green:#43C98B;--red:#FF727B;--orange:#F2A650;
  --soft-blue:#1F2B52;--soft-green:#15392A;--soft-red:#43202A;--soft-yellow:#3A3118;--soft-grey:#252D44;
  --shade:rgba(0,0,0,.6);color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15}
.muted{color:var(--muted)}
small{display:block;color:var(--muted);font-size:.85rem}

/* Topo com borda de inflável */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--yellow);color:var(--yellow-ink);padding:14px 18px 12px}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-11px;height:12px;pointer-events:none;
  background:radial-gradient(circle at 12px 0,var(--yellow) 11px,transparent 11.5px) 0 0/24px 12px repeat-x}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{flex:1;min-width:0}
.brand b{display:block;font-family:var(--display);font-weight:800;font-size:clamp(1.35rem,5.4vw,1.85rem);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:.85rem;font-weight:600;opacity:.8}
.icon-btn{width:44px;height:44px;border-radius:50%;border:2px solid var(--yellow-ink);background:transparent;display:grid;place-items:center;color:var(--yellow-ink)}
.icon-btn svg{width:22px;height:22px}

main{max-width:760px;margin:0 auto;padding:30px 16px 120px}
section{margin-bottom:26px}
.hello{font-size:clamp(1.5rem,6vw,2rem);font-weight:800;margin:4px 0 20px;letter-spacing:-.02em}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sh h2{font-size:1.2rem;font-weight:800}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
button.card{display:block;width:100%;text-align:left;margin:0 0 8px}
button.card:hover{border-color:var(--blue)}
.empty{color:var(--muted);background:transparent;border:1.5px dashed var(--line);border-radius:16px;padding:16px;margin:0}

.btn{border:0;border-radius:999px;padding:11px 18px;min-height:44px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;line-height:1.1}
.btn.sm{min-height:38px;padding:8px 14px;font-size:.9rem}
.primary{background:var(--blue);color:#fff}
.yellow{background:var(--yellow);color:var(--yellow-ink)}
.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.danger{color:var(--red)}
.green{background:var(--green);color:#fff}
.armed{background:var(--red)!important;color:#fff!important;border-color:var(--red)!important}
.lnk{background:none;border:0;padding:0;color:var(--blue);font-weight:700;text-decoration:underline;text-underline-offset:3px}

.ev{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start}
.ev time{font-family:var(--display);font-weight:800;font-size:1.3rem;line-height:1.1}
.ev strong{font-size:1.02rem}
.kind{display:inline-block;font-size:.75rem;font-weight:700;border-radius:999px;padding:2px 9px;margin-bottom:4px}
.kind.Entrega{background:var(--soft-blue);color:var(--blue)}
.kind.Retirada{background:var(--soft-yellow);color:var(--orange)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat span{font-size:.82rem;color:var(--muted);font-weight:600}
.stat b{display:block;font-family:var(--display);font-weight:800;font-size:clamp(.98rem,4vw,1.25rem);margin-top:2px;white-space:nowrap}
.stat.in b{color:var(--green)} .stat.out b{color:var(--red)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}

.st{display:inline-block;font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.st-orc{background:var(--soft-grey);color:var(--muted)}
.st-conf{background:var(--soft-blue);color:var(--blue)}
.st-ent{background:var(--soft-yellow);color:var(--orange)}
.st-ok{background:var(--soft-green);color:var(--green)}
.st-canc{background:var(--soft-red);color:var(--red)}
.due{font-size:.8rem;font-weight:700;color:var(--red)}
.paid{font-size:.8rem;font-weight:700;color:var(--green)}

.loc{display:grid!important;grid-template-columns:54px 1fr;gap:12px}
.dt{text-align:center;background:var(--soft-blue);border-radius:12px;padding:6px 0;color:var(--blue);align-self:start}
.dt b{display:block;font-family:var(--display);font-size:1.4rem;font-weight:800;line-height:1}
.dt span{font-size:.75rem;font-weight:700}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.9rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{width:100%;margin-bottom:12px}

/* Agenda */
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mnav h2{font-size:1.35rem;font-weight:800;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{text-align:center;font-size:.75rem;font-weight:700;color:var(--muted);padding-bottom:2px}
.day{aspect-ratio:1/1.05;border-radius:12px;background:var(--surface);border:1px solid var(--line);padding:5px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;min-width:0}
.day .n{font-weight:700;font-size:.92rem}
.day.today .n{color:var(--blue);font-weight:800}
.day.busy{background:var(--soft-yellow);border-color:transparent}
.day.sel{outline:2.5px solid var(--blue);outline-offset:0}
.day .c{align-self:flex-end;background:var(--ink);color:var(--bg);font-size:.7rem;font-weight:800;border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px}
.blank{visibility:hidden}
.av{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.av:last-child{border-bottom:0}
.bar{grid-column:1/-1;height:8px;border-radius:99px;background:var(--soft-grey);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px}
.bar i.low{background:var(--orange)} .bar i.none{background:var(--red)}

/* Cadastros */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft-grey);border-radius:999px;padding:4px;margin-bottom:14px}
.seg button{border:0;background:transparent;border-radius:999px;padding:9px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.tag{font-size:.75rem;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--soft-grey);color:var(--muted)}

/* Caixa */
.cx{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.cx b.in{color:var(--green)} .cx b.out{color:var(--red)}
.dgrp{font-weight:700;font-size:.85rem;color:var(--muted);margin:14px 0 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}

/* Navegação inferior */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:14px;font-size:.72rem;font-weight:700;color:var(--muted)}
.tabs svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--blue);background:var(--soft-blue)}
@media (min-width:760px){.tabs{max-width:560px;margin:0 auto;left:50%;transform:translateX(-50%);bottom:12px;border:1px solid var(--line);border-radius:22px;padding:6px}}

/* Folha (modal) */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:var(--shade)}
.panel{position:relative;background:var(--bg);width:100%;max-width:640px;max-height:calc(100% - 20px - env(safe-area-inset-top,0px));overflow:auto;border-radius:22px 22px 0 0;padding:0 16px calc(28px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
.panel>header{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 0 12px}
.panel>header h2{font-size:1.3rem;font-weight:800}
.x{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:1.4rem;line-height:1;flex:none}
@keyframes up{from{transform:translateY(24px);opacity:.3}to{transform:none;opacity:1}}
@media (min-width:700px){.sheet{align-items:center}.panel{border-radius:22px;max-height:88vh}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}

/* Formulários */
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.f>span{font-size:.86rem;font-weight:600;color:var(--muted)}
.f i{color:var(--red);font-style:normal}
input,select,textarea{font:inherit;font-size:16px;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:100%;min-width:0}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--soft-blue)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:430px){.g3{grid-template-columns:1fr 1fr}.g3>:first-child{grid-column:1/-1}}
fieldset{border:0;padding:0;margin:14px 0 6px;min-width:0}
legend{font-family:var(--display);font-weight:800;font-size:1.05rem;margin-bottom:10px;padding:0}
.check{display:flex;gap:10px;align-items:center;margin:4px 0 12px;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--blue);flex:none}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.acts .btn{flex:1 1 auto}
.warn{background:var(--soft-red);color:var(--red);border-radius:12px;padding:12px;font-weight:600;margin:10px 0}
.note{background:var(--soft-yellow);color:var(--ink);border-radius:12px;padding:12px;margin:10px 0;font-size:.92rem}
.it{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center;padding:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;margin-bottom:8px}
.it.on{border-color:var(--blue)}
.it .lv{color:var(--muted);font-size:.82rem}
.it .lv.bad{color:var(--red);font-weight:700}
.it label{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);grid-column:1/-1}
.it label input{max-width:130px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);font-size:1.25rem;font-weight:700;line-height:1}
.step input{width:54px;text-align:center;padding:8px 4px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.sum .row{padding:3px 0}
.sum .big{font-family:var(--display);font-weight:800;font-size:1.3rem}
.tipo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tipo label{border:1.5px solid var(--line);border-radius:14px;padding:12px;text-align:center;font-weight:700;background:var(--surface)}
.tipo input{position:absolute;opacity:0;pointer-events:none}
.tipo label:has(input:checked){border-color:var(--ink);background:var(--ink);color:var(--bg)}
.tipo label:has(input:focus-visible){outline:3px solid var(--blue);outline-offset:2px}

/* Detalhe da locação */
.blk{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.blk h3{font-size:.95rem;font-weight:800;margin-bottom:6px}
.blk p{margin:0 0 6px}
.lines{width:100%;border-collapse:collapse;font-size:.95rem}
.lines td{padding:5px 0;vertical-align:top}
.lines td:last-child{text-align:right;white-space:nowrap}
.lines tr.t td{border-top:1px solid var(--line);padding-top:8px;font-weight:700}

/* Documento */
.paper{background:#fff;color:#111;border-radius:12px;padding:24px 20px;border:1px solid var(--line)}
.doc{font-family:Georgia,'Times New Roman',serif;font-size:14px;line-height:1.62;color:#111}
.doc h1{font-family:Georgia,'Times New Roman',serif;font-size:16px;text-align:center;margin:0 0 2px;letter-spacing:.03em}
.doc .sub{text-align:center;margin:0 0 18px;font-size:13px}
.doc p{margin:0 0 10px;text-align:justify}
.doc table{width:100%;border-collapse:collapse;margin:6px 0 12px;font-size:13px}
.doc th,.doc td{border:1px solid #999;padding:4px 7px;text-align:left}
.doc td.r{text-align:right;white-space:nowrap}
.doc ol{padding-left:22px;margin:0 0 10px}
.doc li{margin-bottom:6px;text-align:justify}
.sigs{display:grid;grid-template-columns:1fr 1fr;gap:26px 24px;margin-top:30px}
.sigs div{text-align:center;font-size:12.5px;line-height:1.35}
.sigs .ln{border-top:1px solid #111;padding-top:4px;margin-top:2px}
.sigs img{height:62px;max-width:100%;display:block;margin:0 auto -4px;object-fit:contain}
.sigs .sp{height:58px}
.sigs em{display:block;font-size:10.5px;color:#555;font-style:normal}
.pb{margin-top:36px;border-top:1px dashed #bbb;padding-top:28px}
.docbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.docbar .btn{flex:1 1 auto}
.pad{background:#fff;border-radius:14px;border:2px dashed var(--line);touch-action:none;width:100%;height:220px;display:block}

#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#print{display:none}
.onb ol{margin:8px 0 0;padding-left:22px}
.onb li{margin-bottom:6px}
.srv{font-size:.85rem;color:var(--muted);margin-top:10px}

@media print{
  :root{padding:0}
  body{background:#fff}
  body>*:not(#print){display:none!important}
  #print{display:block}
  .pb{border:0;margin-top:0;padding-top:0;break-before:page;page-break-before:always}
  @page{margin:18mm 16mm}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><b id="empresa">Minha locadora</b><span>Painel do locador</span></div>
    <button class="icon-btn" data-a="tab" data-id="ajustes" aria-label="Ajustes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</header>

<main id="main"></main>

<nav class="tabs" aria-label="Seções">
  <button data-a="tab" data-id="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Início</button>
  <button data-a="tab" data-id="agenda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>Agenda</button>
  <button data-a="tab" data-id="locacoes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2.5a2.5 2.5 0 0 0 0 5V17a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2.5a2.5 2.5 0 0 0 0-5z"/><path d="M14 5v14" stroke-dasharray="2 2.5"/></svg>Locações</button>
  <button data-a="tab" data-id="cadastros"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 7.5v9L12 21l9-4.5v-9z"/><path d="m3 7.5 9 4.5 9-4.5M12 12v9"/></svg>Cadastros</button>
  <button data-a="tab" data-id="caixa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a1 1 0 0 1-1-1z"/><path d="M4 7V6a2 2 0 0 1 2-2h10v3"/><circle cx="16" cy="13.5" r="1.3"/></svg>Caixa</button>
</nav>

<div id="sheet" class="sheet" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="print"></div>
<input type="file" id="fileImport" accept="application/json,.json" hidden>

<script>
/* ============ utilidades ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

const nfmt=n=>(+n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const numv=v=>{let s=String(v??'').trim().replace(/[R$\s]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isNaN(n)?0:n};
const pad2=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const hoje=()=>isoOf(new Date());
const agoraHM=()=>{const d=new Date();return pad2(d.getHours())+':'+pad2(d.getMinutes())};
const toD=iso=>{const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(iso,n)=>{const d=toD(iso);d.setDate(d.getDate()+n);return isoOf(d)};
const fData=iso=>iso?iso.split('-').reverse().join('/'):'—';
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const dataExtenso=iso=>{const [y,m,d]=iso.split('-').map(Number);return `${d} de ${MESES[m-1]} de ${y}`};
const onlyDig=s=>String(s||'').replace(/\D/g,'');
function cpfOk(v){const c=onlyDig(v);if(c.length!==11||/^(\d)\1+$/.test(c))return false;let s=0;for(let i=0;i<9;i++)s+=+c[i]*(10-i);let r=(s*10)%11;if(r===10)r=0;if(r!==+c[9])return false;s=0;for(let i=0;i<10;i++)s+=+c[i]*(11-i);r=(s*10)%11;if(r===10)r=0;return r===+c[10]}
const fCPF=v=>onlyDig(v).slice(0,11).replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');
const fDoc=v=>{const c=onlyDig(v).slice(0,14);if(c.length<=11)return fCPF(c);return c.replace(/^(\d{2})(\d)/,'$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1/$2').replace(/(\d{4})(\d)/,'$1-$2')};
const fTel=v=>{const c=onlyDig(v).slice(0,11);if(c.length<=10)return c.replace(/^(\d{2})(\d)/,'($1) $2').replace(/(\d{4})(\d)/,'$1-$2');return c.replace(/^(\d{2})(\d{5})(\d)/,'($1) $2-$3')};
const fCEP=v=>onlyDig(v).slice(0,8).replace(/(\d{5})(\d)/,'$1-$2');
function extenso(v){
  v=Math.round((+v||0)*100)/100;const int=Math.floor(v),cent=Math.round((v-int)*100);
  const u=['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
  const d=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
  const c=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
  const a999=n=>{if(!n)return'';if(n===100)return'cem';const p=[],h=Math.floor(n/100),r=n%100;if(h)p.push(c[h]);if(r){if(r<20)p.push(u[r]);else{const t=Math.floor(r/10),o=r%10;p.push(o?d[t]+' e '+u[o]:d[t])}}return p.join(' e ')};
  const inteiro=n=>{if(!n)return'zero';const mi=Math.floor(n/1e6),mil=Math.floor(n/1000)%1000,r=n%1000,parts=[];
    if(mi)parts.push(mi===1?'um milhão':a999(mi)+' milhões');if(mil)parts.push(mil===1?'mil':a999(mil)+' mil');if(r)parts.push(a999(r));
    let s=parts[0];for(let i=1;i<parts.length;i++){const last=i===parts.length-1;const lastVal=r?r:mil*1000;s+=(last&&(lastVal<100||lastVal%100===0))?' e '+parts[i]:' '+parts[i]}return s};
  let out='';
  if(int)out=inteiro(int)+(int===1?' real':(int%1e6===0?' de reais':' reais'));
  if(cent)out+=(out?' e ':'')+a999(cent)+(cent===1?' centavo':' centavos');
  return out||'zero real';
}

let db=null,dl=null,ro=false;
const plain=o=>JSON.parse(JSON.stringify(o??{}));
function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LS)||'null');if(j)for(const k in S)if(j[k])S[k]=j[k]}catch(e){}}
function saveLocal(){if(db)return;try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast('Não foi possível salvar neste aparelho.')}}
function dbFail(e){
  if(e&&e.code==='invalid_argument'){ro=true;toast('Você não tem permissão para alterar estes dados.')}
  else if(e&&e.code==='quota_exceeded')toast('Limite de registros atingido. Exporte um backup e apague lançamentos antigos.');
  else toast('Não foi possível salvar. Verifique a conexão e tente de novo.');
  return false;
}
async function put(col,obj,quiet){
  if(ro){toast('Você não tem permissão para alterar estes dados.');return false}
  S[col]={...S[col],[obj.id]:obj};if(!quiet)render();
  if(db){try{await db.collection(col).doc(obj.id).set(plain(obj))}catch(e){return dbFail(e)}}else saveLocal();
  return true;
}
async function del(col,id){
  if(ro){toast('Você não tem permissão para alterar estes dados.');return false}
  const n={...S[col]};delete n[id];S[col]=n;render();
  if(db){try{await db.collection(col).doc(id).delete()}catch(e){return dbFail(e)}}else saveLocal();
  return true;
}
async function putConfig(cfg){
  if(ro){toast('Você não tem permissão para alterar estes dados.');return false}
  S.config=cfg;render();
  if(db){try{await db.doc('config/geral').set(plain(cfg))}catch(e){return dbFail(e)}}else saveLocal();
  return true;
}
async function initCaps(){
  if(!window.claude||typeof window.claude.use!=='function')return;
  try{dl=await window.claude.use('downloads')}catch(e){dl=null}
  let d=null;try{d=await window.claude.use('db')}catch(e){d=null}
  if(d){
    db=d;
    COLS.forEach(c=>db.collection(c).onSnapshot(snap=>{const o={};snap.docs.forEach(x=>{o[x.id]=x.data()});S[c]=o;render()},e=>console.warn(c,e)));
    db.doc('config/geral').onSnapshot(s=>{S.config=s.exists?s.data():{};render()},e=>console.warn(e));
  }
  render();
}

/* ============ regras de negócio ============ */
const locs=()=>Object.values(S.locacoes);
const fim=l=>l.dataFim||l.dataInicio;
const subtotal=l=>(l.itens||[]).reduce((a,i)=>a+numv(i.qtd)*numv(i.valor),0);
const total=l=>subtotal(l)+numv(l.frete)-numv(l.desconto);
const pago=l=>Object.values(S.caixa).filter(c=>c.locacaoId===l.id&&c.tipo==='entrada').reduce((a,c)=>a+numv(c.valor),0);
const saldo=l=>total(l)-pago(l);
const bloqueia=l=>l.status==='confirmada'||l.status==='entregue';
const cobra=l=>['confirmada','entregue','concluida'].includes(l.status);
const numero=l=>String(l.numero||0).padStart(4,'0')+'/'+(l.dataInicio||'').slice(0,4);
const cliNome=l=>S.clientes[l.clienteId]?.nome||'Cliente removido';
const itemNome=i=>S.brinquedos[i.bid]?.nome||i.nome||'Brinquedo removido';
const itensTxt=l=>(l.itens||[]).map(i=>(i.qtd>1?i.qtd+'× ':'')+itemNome(i)).join(', ');
function endCli(c){if(!c)return'';const a=[c.rua?(c.rua+(c.numero?', '+c.numero:'')):'',c.complemento,c.bairro,c.cidade?(c.cidade+(c.uf?'/'+c.uf:'')):'',c.cep?'CEP '+c.cep:''].filter(Boolean);return a.join(', ')}
function datas(a,b){const r=[];let x=a,g=0;while(x<=b&&g<62){r.push(x);x=addDays(x,1);g++}return r}
function reservado(bid,iso,ignore){return locs().filter(l=>l.id!==ignore&&bloqueia(l)&&l.dataInicio<=iso&&fim(l)>=iso).reduce((a,l)=>a+(l.itens||[]).filter(i=>i.bid===bid).reduce((s,i)=>s+(+i.qtd||0),0),0)}
function livre(bid,iso,ignore){const b=S.brinquedos[bid];return b?(+b.quantidade||0)-reservado(bid,iso,ignore):0}
function minLivre(bid,a,b,ignore){return Math.min(...datas(a,b<a?a:b).map(d=>livre(bid,d,ignore)))}
function conflitos(l){const out=[];for(const it of l.itens||[]){const b=S.brinquedos[it.bid];if(!b)continue;for(const d of datas(l.dataInicio,fim(l))){const lv=livre(it.bid,d,l.id);if(+it.qtd>lv){out.push(`${b.nome} em ${fData(d)}: ${Math.max(lv,0)} livre(s), pedido ${it.qtd}`);break}}}return out}
function noDia(iso){return locs().filter(l=>l.status!=='cancelada'&&l.dataInicio<=iso&&fim(l)>=iso)}

/* ---------- Início ---------- */
function evList(iso){
  const a=[];locs().filter(bloqueia).concat(locs().filter(l=>l.status==='concluida')).forEach(l=>{
    if(l.dataInicio===iso)a.push({t:l.entrega||'',k:'Entrega',l});
    if(fim(l)===iso)a.push({t:l.retirada||'',k:'Retirada',l});
  });
  a.sort((x,y)=>(x.t||'99').localeCompare(y.t||'99'));
  if(!a.length)return `<p class="empty">Nenhuma entrega ou retirada.</p>`;
  return a.map(e=>`<button class="card ev" data-a="verLoc" data-id="${e.l.id}"><time>${esc(e.t||'--:--')}</time><div><span class="kind ${e.k}">${e.k}</span> ${e.l.status==='concluida'?'<span class="st st-ok">Concluída</span>':''}<br><strong>${esc(cliNome(e.l))}</strong><small>${esc(e.l.endereco||'')}</small><small>${esc(itensTxt(e.l))}</small></div></button>`).join('');
}
function vInicio(){

  const rec=locs().filter(l=>cobra(l)&&saldo(l)>0.004).sort((a,b)=>a.dataInicio.localeCompare(b.dataInicio));

/* ---------- Agenda ---------- */
function vAgenda(){
  const [y,m]=ui.mes.split('-').map(Number),first=new Date(y,m-1,1),nd=new Date(y,m,0).getDate(),h=hoje();
  let cells=DOW.map(w=>`<div class="wd">${w}</div>`).join('');
  for(let i=0;i<first.getDay();i++)cells+=`<div class="day blank"></div>`;
  for(let d=1;d<=nd;d++){
    const iso=`${y}-${pad2(m)}-${pad2(d)}`,ls=noDia(iso),n=ls.filter(l=>l.status!=='orcamento').length;
    cells+=`<button class="day ${n?'busy':''} ${iso===h?'today':''} ${iso===ui.dia?'sel':''}" data-a="dia" data-dia="${iso}" aria-label="${d} de ${MESES[m-1]}${n?', '+n+' locação(ões)':''}"><span class="n">${d}</span>${ls.length?`<span class="c">${ls.length}</span>`:''}</button>`;
  }
  const dl_=noDia(ui.dia).sort((a,b)=>(a.entrega||'').localeCompare(b.entrega||''));
  const bs=Object.values(S.brinquedos).filter(b=>b.ativo!==false).sort((a,b)=>a.nome.localeCompare(b.nome));
  const disp=bs.length?bs.map(b=>{const q=+b.quantidade||0,lv=Math.max(0,livre(b.id,ui.dia));const pc=q?lv/q*100:0;return `<div class="av"><strong>${esc(b.nome)}</strong><span class="${lv?'':'due'}">${lv} de ${q} livre${q>1?'s':''}</span><div class="bar"><i class="${lv===0?'none':pc<50?'low':''}" style="width:${Math.max(pc,lv?6:100)}%"></i></div></div>`}).join(''):`<p class="muted">Cadastre brinquedos para ver a disponibilidade.</p>`;
  return `<div class="mnav"><button class="x" data-a="mes" data-d="-1" aria-label="Mês anterior">‹</button><h2>${MESES[m-1]} ${y}</h2><button class="x" data-a="mes" data-d="1" aria-label="Próximo mês">›</button></div>
  <div class="cal">${cells}</div>
  <section style="margin-top:22px"><div class="sh"><h2>${cap(dow(ui.dia))}, ${fData(ui.dia)}</h2><button class="btn primary sm" data-a="novaLoc" data-dia="${ui.dia}">Nova locação</button></div>

   <small>${esc(itensTxt(l))}</small>
   <div class="row" style="margin-top:4px"><span>${brl(total(l))}</span>${cobra(l)?(sd>0.004?`<span class="due">Falta ${brl(sd)}</span>`:`<span class="paid">Pago</span>`):''}</div></div></button>`;
}
function listLoc(){
  const h=hoje(),q=ui.busca.toLowerCase();let a=locs();
  const f={proximas:l=>fim(l)>=h&&l.status!=='cancelada'&&l.status!=='concluida',orcamentos:l=>l.status==='orcamento',receber:l=>cobra(l)&&saldo(l)>0.004,concluidas:l=>l.status==='concluida',canceladas:l=>l.status==='cancelada',todas:()=>true}[ui.filtro];
  a=a.filter(f);
  if(q)a=a.filter(l=>(cliNome(l)+' '+itensTxt(l)+' '+(l.endereco||'')+' '+numero(l)).toLowerCase().includes(q));
  a.sort((x,y)=>ui.filtro==='proximas'||ui.filtro==='orcamentos'?x.dataInicio.localeCompare(y.dataInicio):y.dataInicio.localeCompare(x.dataInicio));
  return a.length?a.map(cardLoc).join(''):`<p class="empty">Nenhuma locação aqui.</p>`;
}

function recalcLoc(f){
  if(!f)return;const a=f.elements.dataInicio.value,b=f.elements.dataFim.value||a,id=f.dataset.id;let sub=0;
  f.querySelectorAll('.it').forEach(r=>{const bid=r.dataset.bid,q=parseInt(r.querySelector('[name^="q_"]').value)||0,v=numv(r.querySelector('[name^="v_"]').value);sub+=q*v;
    const s=r.querySelector('[data-livre]'),b0=S.brinquedos[bid];
    if(s&&b0&&a){const lv=Math.max(0,minLivre(bid,a,b,id));s.textContent=lv<=0?'Sem unidade livre no período':`${lv} de ${b0.quantidade} livre${lv>1?'s':''} no período`;s.className='lv'+(q>lv?' bad':'')}
    r.classList.toggle('on',q>0)});
  f.querySelector('[data-sub]').textContent=brl(sub);
  f.querySelector('[data-tot]').textContent=brl(sub+numv(f.elements.frete.value)-numv(f.elements.desconto.value));
}

function setupPad(){
  const cv=$('#pad'),r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);ctx.lineWidth=2.6;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111';
  padState={cv,ctx,dirty:false,down:false};
  const pt=e=>{const b=cv.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};
  cv.addEventListener('pointerdown',e=>{padState.down=true;cv.setPointerCapture(e.pointerId);const [x,y]=pt(e);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+.1,y+.1);ctx.stroke();padState.dirty=true});
  cv.addEventListener('pointermove',e=>{if(!padState.down)return;const [x,y]=pt(e);ctx.lineTo(x,y);ctx.stroke()});
  const up=()=>{padState.down=false};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
}

  editLoc:id=>formLoc(id),
  delLoc:async id=>{closeSheet();await del('locacoes',id);if(S.assinaturas[id])await del('assinaturas',id);toast('Locação excluída. Os lançamentos no caixa foram mantidos.')},
  status:async(id,t)=>{const l=plain(S.locacoes[id]);l.status=t.dataset.st;if(await put('locacoes',l)){toast('Situação: '+ST[l.status][0]);openLoc(id)}},
  pagar:id=>formPag(id),
  vist:(id,t)=>formVist(id,t.dataset.fase),
  docs:id=>openDocs(id),
  assinar:(id,t)=>openAss(id,t.dataset.quem),
  limparPad:()=>{if(!padState)return;const {cv,ctx}=padState;ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.restore();padState.dirty=false},
  salvarPad:async(id,t)=>{
    if(!padState||!padState.dirty){toast('Assine dentro do quadro antes de salvar.');return}
    const {cv}=padState,o=document.createElement('canvas');o.width=600;o.height=Math.round(600*cv.height/cv.width);o.getContext('2d').drawImage(cv,0,0,o.width,o.height);
    const cur=plain(S.assinaturas[id]||{id});cur.id=id;cur[t.dataset.quem]={img:o.toDataURL('image/png'),nome:t.dataset.nome,em:new Date().toISOString()};
    if(await put('assinaturas',cur)){toast('Assinatura salva');openDocs(id)}
  },
  imprimir:id=>{const l=S.locacoes[id];$('#print').innerHTML=docHTML(l);try{window.print()}catch(e){toast(dl?'Impressão bloqueada aqui. Use “Baixar arquivo” e imprima de lá.':'Impressão bloqueada nesta visualização.')}},
  baixarDoc:id=>{const l=S.locacoes[id];baixar(`contrato-${numero(l).replace('/','-')}-${(cliNome(l).split(' ')[0]||'cliente').toLowerCase()}.html`,docFile(l))},
  novoCli:()=>formCli(),
  editCli:id=>formCli(id),
  novoCliLoc:()=>{const f=$('form[data-form="loc"]');locDraft=readLoc(f);formCli(null,'loc')},
  delCli:async id=>{if(locs().some(l=>l.clienteId===id)){toast('Este cliente tem locações. Exclua-as antes de remover o cadastro.');return}closeSheet();await del('clientes',id);toast('Cliente excluído')},
  novoBrinq:()=>formBrinq(),
  editBrinq:id=>formBrinq(id),
  delBrinq:async id=>{closeSheet();await del('brinquedos',id);toast('Brinquedo excluído')},
  novoCaixa:(i,t)=>formCaixa(null,t.dataset.tipo),
  editCaixa:id=>formCaixa(id),
  delCaixa:async id=>{closeSheet();await del('caixa',id);toast('Lançamento excluído')},
  menos:(i,t)=>{const inp=t.parentElement.querySelector('input');inp.value=Math.max(0,(parseInt(inp.value)||0)-1);recalcLoc(t.closest('form'))},
  mais:(i,t)=>{const inp=t.parentElement.querySelector('input');inp.value=(parseInt(inp.value)||0)+1;recalcLoc(t.closest('form'))},
  csv:()=>{
    const rows=cxDoMes().sort((a,b)=>a.data.localeCompare(b.data));
    const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
    const txt='\ufeff'+['Data;Tipo;Categoria;Descrição;Forma;Contrato;Valor'].concat(rows.map(c=>{const l=c.locacaoId?S.locacoes[c.locacaoId]:null;return [fData(c.data),c.tipo==='entrada'?'Entrada':'Saída',q(c.categoria),q(c.descricao),q(c.forma),l?numero(l):'',(c.tipo==='saida'?'-':'')+nfmt(c.valor)].join(';')})).join('\r\n');
    baixar(`caixa-${ui.cxMes}.csv`,txt);
  },
  backup:()=>baixar(`backup-locacoes-${hoje()}.json`,JSON.stringify({app:'locabrinq',versao:1,exportadoEm:new Date().toISOString(),...S},null,1)),
  importar:()=>$('#fileImport').click()
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  if(t.hasAttribute('data-arm')&&!t.classList.contains('armed')){e.preventDefault();t.classList.add('armed');t.dataset.txt=t.textContent;t.textContent='Toque de novo para confirmar';setTimeout(()=>{if(t.isConnected){t.classList.remove('armed');t.textContent=t.dataset.txt}},3500);return}
  const fn=A[t.dataset.a];if(fn){e.preventDefault();fn(t.dataset.id,t,e)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.mask){t.setCustomValidity('');t.value={cpf:fCPF,tel:fTel,cep:fCEP,doc:fDoc}[t.dataset.mask](t.value)}
  if(t.id==='busca'){ui.busca=t.value;const l=$('#lista');if(l)l.innerHTML=ui.tab==='locacoes'?listLoc():listCad()}
  const f=t.form;
  if(f&&f.dataset.form==='loc'){
    if(t.name==='dataInicio'&&(!f.elements.dataFim.value||f.elements.dataFim.value<t.value))f.elements.dataFim.value=t.value;
    delete f.dataset.force;recalcLoc(f);
  }
});
document.addEventListener('change',e=>{
  const t=e.target,f=t.form;
  if(t.id==='fileImport'&&t.files[0]){importar(t.files[0]);t.value='';return}
  if(!f)return;
  if(t.name==='mesmoEndereco')f.querySelector('[data-end]').hidden=t.checked;
  if(t.name==='respCliente')f.querySelector('[data-resp]').hidden=t.checked;
  if(f.dataset.form==='caixa'&&t.name==='tipo'){f.elements.categoria.innerHTML=opt(t.value==='entrada'?CAT_ENT:CAT_SAI);f.querySelector('[data-vinc]').hidden=t.value==='saida';if(t.value==='saida')f.elements.locacaoId.value=''}
  if(f.dataset.form==='loc')recalcLoc(f);
});
async function importar(file){
  try{
    const j=JSON.parse(await file.text());if(!j||typeof j!=='object')throw 0;
    let n=0;toast('Importando…');
    for(const c of COLS)for(const o of Object.values(j[c]||{}))if(o&&o.id){if(!await put(c,o,true))throw 1;n++}
    if(j.config&&typeof j.config==='object')await putConfig(j.config);
    render();toast(`${n} registros importados`);
  }catch(e){toast('Não foi possível importar. Use um arquivo de backup exportado por este app.')}
}

/* ============ envio de formulários ============ */
const SUB={
  config:async f=>{
    const fd=new FormData(f),g=k=>(fd.get(k)??'').toString().trim();
    const d=onlyDig(g('doc'));if(d.length===11&&!cpfOk(d)){f.elements.doc.setCustomValidity('CPF inválido');f.reportValidity();return}
    if(d.length!==11&&d.length!==14){f.elements.doc.setCustomValidity('Informe um CPF (11 dígitos) ou CNPJ (14 dígitos)');f.reportValidity();return}
    const cfg={...plain(S.config),empresa:g('empresa'),doc:g('doc'),tel:g('tel'),endereco:g('endereco'),cidade:g('cidade'),foro:g('foro'),pix:g('pix'),cancDias:parseInt(g('cancDias'))||0,cancPct:Math.min(100,parseInt(g('cancPct'))||0),taxaVisita:numv(g('taxaVisita')),extras:g('extras')};
    if(await putConfig(cfg))toast('Ajustes salvos');
  },
  brinq:async f=>{
    const fd=new FormData(f),g=k=>(fd.get(k)??'').toString().trim(),id=f.dataset.id;
    if(numv(g('valor'))<=0){f.elements.valor.setCustomValidity('Informe o valor da diária');f.reportValidity();f.elements.valor.addEventListener('input',()=>f.elements.valor.setCustomValidity(''),{once:true});return}
    const b={...(id?plain(S.brinquedos[id]):{}),id:id||uid(),nome:g('nome'),categoria:g('categoria'),quantidade:Math.max(1,parseInt(g('quantidade'))||1),valor:numv(g('valor')),dimensoes:g('dimensoes'),idade:g('idade'),capacidade:parseInt(g('capacidade'))||'',energia:g('energia'),regras:g('regras'),ativo:fd.get('ativo')==='on'};
    if(await put('brinquedos',b)){closeSheet();toast(id?'Brinquedo atualizado':'Brinquedo cadastrado')}
  },
  cli:async f=>{
    const fd=new FormData(f),g=k=>(fd.get(k)??'').toString().trim(),id=f.dataset.id;
    if(!cpfOk(g('cpf'))){f.elements.cpf.setCustomValidity('CPF inválido. Confira os números.');f.reportValidity();return}
    const dup=Object.values(S.clientes).find(c=>c.id!==id&&onlyDig(c.cpf)===onlyDig(g('cpf')));
    if(dup){f.elements.cpf.setCustomValidity(`Já existe um cliente com este CPF: ${dup.nome}`);f.reportValidity();return}
    const c={...(id?plain(S.clientes[id]):{criadoEm:new Date().toISOString()}),id:id||uid()};
    ['nome','cpf','rg','tel','email','cep','numero','rua','complemento','bairro','cidade','uf','obs'].forEach(k=>c[k]=g(k));
    if(!await put('clientes',c))return;
    toast(id?'Cliente atualizado':'Cliente cadastrado');
    if(ui.retorno==='loc'&&locDraft){const d=locDraft;d.clienteId=c.id;locDraft=null;ui.retorno=null;formLoc(d.id||null,d)}else closeSheet();
  },
  loc:async f=>{
    const d=readLoc(f),old=d.id?S.locacoes[d.id]:null,errs=[],box=f.querySelector('.warn');
    if(!d.clienteId)errs.push('Escolha o cliente.');
    if(!d.dataInicio)errs.push('Informe a data da entrega.');
    if(d.dataFim<d.dataInicio)errs.push('A retirada não pode ser antes da entrega.');
    if(!d.itens.length)errs.push('Adicione pelo menos um brinquedo.');
    if(!d.mesmoEndereco&&!d.endereco)errs.push('Informe o endereço do evento.');
    if(!d.respCliente){if(!d.respNome)errs.push('Informe o nome do responsável no local.');if(!cpfOk(d.respCpf))errs.push('CPF do responsável inválido.')}
    if(errs.length){box.innerHTML=errs.map(esc).join('<br>');box.hidden=false;box.scrollIntoView({block:'center',behavior:'smooth'});return}
    const cl=S.clientes[d.clienteId];
    if(d.mesmoEndereco)d.endereco=endCli(cl);
    if(d.respCliente){d.respNome=cl.nome;d.respCpf=cl.cpf;d.respTel=cl.tel}
    const cf=bloqueia(d)?conflitos({...d,id:d.id||'__novo'}):[];
    if(cf.length&&f.dataset.force!=='1'){box.innerHTML='<b>Falta disponibilidade:</b><br>'+cf.map(esc).join('<br>')+'<br><br>Toque em salvar de novo para registrar mesmo assim.';box.hidden=false;f.dataset.force='1';box.scrollIntoView({block:'center',behavior:'smooth'});return}
    const obj={...(old?plain(old):{}),...d,id:d.id||uid()};
    if(!old){obj.numero=Math.max(0,...locs().map(x=>+x.numero||0))+1;obj.criadoEm=new Date().toISOString()}
    if(await put('locacoes',obj)){toast(old?'Locação atualizada':'Locação registrada');openLoc(obj.id)}
  },
  caixa:async f=>{
    const fd=new FormData(f),g=k=>(fd.get(k)??'').toString().trim(),id=f.dataset.id,v=numv(g('valor'));
    if(v<=0){f.elements.valor.setCustomValidity('Informe um valor maior que zero');f.reportValidity();f.elements.valor.addEventListener('input',()=>f.elements.valor.setCustomValidity(''),{once:true});return}
    const c={...(id?plain(S.caixa[id]):{criadoEm:new Date().toISOString()}),id:id||uid(),tipo:g('tipo'),valor:v,data:g('data'),categoria:g('categoria'),forma:g('forma'),descricao:g('descricao'),locacaoId:g('tipo')==='entrada'?g('locacaoId'):''};
    if(await put('caixa',c)){closeSheet();toast('Lançamento salvo')}
  },
  pag:async f=>{
    const fd=new FormData(f),g=k=>(fd.get(k)??'').toString().trim(),id=f.dataset.id,l=S.locacoes[id],v=numv(g('valor'));
    if(v<=0){f.elements.valor.setCustomValidity('Informe um valor maior que zero');f.reportValidity();f.elements.valor.addEventListener('input',()=>f.elements.valor.setCustomValidity(''),{once:true});return}
    const c={id:uid(),tipo:'entrada',valor:v,data:g('data'),forma:g('forma'),categoria:g('categoria'),descricao:`Contrato ${numero(l)} – ${cliNome(l)}`,locacaoId:id,criadoEm:new Date().toISOString()};
    if(await put('caixa',c)){toast('Pagamento registrado');openLoc(id)}
  },
  vist:async f=>{
    const id=f.dataset.id,fase=f.dataset.fase,l=plain(S.locacoes[id]),fd=new FormData(f);
    const itens=[...f.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value);
    l.vistoria={...(l.vistoria||{}),[fase]:{itens,obs:(fd.get('obs')||'').toString().trim(),em:fData(hoje())+' às '+(fd.get('hora')||agoraHM())}};
    l.status=fase==='entrega'?'entregue':'concluida';
    if(await put('locacoes',l)){toast(fase==='entrega'?'Entrega registrada':'Retirada registrada – locação concluída');openLoc(id)}
  }
};
document.addEventListener('submit',e=>{const f=e.target,k=f.dataset.form;if(!k||!SUB[k])return;e.preventDefault();SUB[k](f)});

/* ============ início ============ */
loadLocal();
render();
initCaps();
</script>
