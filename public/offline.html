<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sem conexão</title>
<style>
:root{--bg:#EEF1F6;--ink:#16203A;--muted:#58637C;--blue:#2350D8;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0E1322;--ink:#E7EBF5;--muted:#9BA5BD;--blue:#7196FF;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:24px;text-align:center}
h1{font-size:1.5rem;margin:0 0 8px}p{color:var(--muted);margin:0 0 20px}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:12px 22px;background:var(--blue);color:#fff;cursor:pointer}
</style>
</head>
<body>
<div>
<h1>Sem conexão</h1>
<p>A agenda e as locações precisam de internet para ficarem sempre atualizadas.</p>
<button onclick="location.reload()">Tentar de novo</button>
</div>
</body>
</html>
